services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: routeshare-postgres
    environment:
      POSTGRES_DB: ${ROUTESHARE_POSTGRES_DB:-routeshare}
      POSTGRES_USER: ${ROUTESHARE_POSTGRES_USER:-routeshare}
      POSTGRES_PASSWORD: ${ROUTESHARE_POSTGRES_PASSWORD:-routeshare_dev_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROUTESHARE_POSTGRES_USER:-routeshare} -d ${ROUTESHARE_POSTGRES_DB:-routeshare}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: routeshare-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: routeshare-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  keycloak:
    image: keycloak/keycloak:25.0
    container_name: routeshare-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"
    volumes:
      - ../keycloak/import:/opt/keycloak/data/import:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: routeshare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
