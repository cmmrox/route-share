server:
  port: 8080
spring:
  application:
    name: routeshare-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ROUTESHARE_JDBC_URL:jdbc:postgresql://localhost:5432/routeshare}
    username: ${ROUTESHARE_DB_USER:routeshare}
    password: ${ROUTESHARE_DB_PASSWORD:routeshare_dev_password}
    hikari:
      maximum-pool-size: ${ROUTESHARE_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${ROUTESHARE_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${ROUTESHARE_DB_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${ROUTESHARE_REDIS_HOST:localhost}
      port: ${ROUTESHARE_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${ROUTESHARE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ROUTESHARE_KEYCLOAK_ISSUER:http://localhost:8081/realms/routeshare}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  metrics:
    tags:
      application: routeshare-api
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.routeshare: INFO

# Sentry backend error monitoring. Disabled until a DSN is provided.
sentry:
  dsn: ${SENTRY_DSN_BACKEND:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:routeshare-api@0.1.0-SNAPSHOT}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false


routeshare:
  # Leader-elected sweeps for every clock in the product. Durations and limits are NOT here — they
  # are product rules and live in platform.policy_setting so they can be corrected without a deploy.
  # Only the cadence and the arrival-detection tuning are properties.
  scheduler:
    enabled: ${ROUTESHARE_SCHEDULER_ENABLED:true}
    tick-seconds: ${ROUTESHARE_SCHEDULER_TICK_SECONDS:60}
  pickup-arrival:
    # A geofence alone lets a drive-past manufacture a no-show, so arrival also requires a dwell.
    geofence-meters: ${ROUTESHARE_PICKUP_ARRIVAL_GEOFENCE_METERS:120}
    dwell-seconds: ${ROUTESHARE_PICKUP_ARRIVAL_DWELL_SECONDS:30}
  # Working days ComiGo answers a driver's rate re-assessment within; shown in D39's copy.
  rate-band:
    review-sla-days: ${ROUTESHARE_RATE_BAND_REVIEW_SLA_DAYS:3}
  # Policy reads are hot — every search result prices one — so they are cached and evicted on write.
  policy:
    cache-ttl-seconds: ${ROUTESHARE_POLICY_CACHE_TTL_SECONDS:60}
  payment:
    # How long an authorisation is assumed good. Past this, an uncaptured hold is somebody's money
    # sitting in limbo, and reconciliation surfaces it to operations.
    auth-validity-hours: ${ROUTESHARE_PAYMENT_AUTH_VALIDITY_HOURS:168}
    capture-max-attempts: ${ROUTESHARE_PAYMENT_CAPTURE_MAX_ATTEMPTS:3}
  short-link:
    # Where a shared trip code resolves. The code itself is ten base32 characters — unguessable
    # rather than merely unique, because it is pasted into group chats.
    base-url: ${ROUTESHARE_SHORT_LINK_BASE_URL:https://comigo.lk/r/}
  verification:
    # How long a rider may wait on an identity decision before operations should be told. Only the
    # alerting threshold lives here; the session TTL and the camera-only switch are policy settings
    # (VERIFICATION_SESSION_TTL_MINUTES, VERIFY_CAMERA_ONLY), because a rule the product states is
    # runtime-configurable by decision D1 and must not also exist as a second value in a file.
    review-sla-hours: ${ROUTESHARE_VERIFICATION_REVIEW_SLA_HOURS:24}
  google-maps:
    enabled: ${GOOGLE_MAPS_ENABLED:false}
    server-api-key: ${GOOGLE_MAPS_SERVER_API_KEY:}
    place-details-cache-ttl-seconds: ${GOOGLE_MAPS_PLACE_DETAILS_CACHE_TTL_SECONDS:86400}
    route-cache-ttl-seconds: ${GOOGLE_MAPS_ROUTE_CACHE_TTL_SECONDS:604800}
    provider-failure-threshold: ${GOOGLE_MAPS_PROVIDER_FAILURE_THRESHOLD:3}
    provider-cooldown-seconds: ${GOOGLE_MAPS_PROVIDER_COOLDOWN_SECONDS:30}
  notify-lk:
    enabled: ${NOTIFY_LK_ENABLED:false}
    api-base-url: ${NOTIFY_LK_API_BASE_URL:https://app.notify.lk/api/v1}
    user-id: ${NOTIFY_LK_API_USER_ID:}
    api-key: ${NOTIFY_LK_API_KEY:}
    sender-id: ${NOTIFY_LK_SENDER_ID:}
    allow-demo-sender-for-otp: ${NOTIFY_LK_ALLOW_DEMO_SENDER_FOR_OTP:false}
    otp-message-template: ${NOTIFY_LK_OTP_MESSAGE_TEMPLATE:Your RouteShare verification code is %s. It expires in %d minutes.}

  cybersource:
    enabled: ${CYBERSOURCE_ENABLED:false}
    environment: ${CYBERSOURCE_ENVIRONMENT:sandbox}
    merchant-id: ${CYBERSOURCE_MERCHANT_ID:}
    key-id: ${CYBERSOURCE_KEY_ID:}
    shared-secret: ${CYBERSOURCE_SHARED_SECRET:}
    capture-mode: ${CYBERSOURCE_CAPTURE_MODE:manual}
    webhook-secret: ${CYBERSOURCE_WEBHOOK_SECRET:}

  share:
    base-url: ${ROUTESHARE_SHARE_BASE_URL:https://app.routeshare.lk/share/trip}
    default-ttl-minutes: ${ROUTESHARE_SHARE_DEFAULT_TTL_MINUTES:240}
    max-ttl-minutes: ${ROUTESHARE_SHARE_MAX_TTL_MINUTES:1440}

  commission:
    default-rate: ${ROUTESHARE_COMMISSION_DEFAULT_RATE:0.10}

  identity:
    # Per-subject token-projection cache; 0 disables and restores the write-per-request behavior.
    projection-cache-ttl-seconds: ${ROUTESHARE_IDENTITY_PROJECTION_CACHE_TTL_SECONDS:300}

  rate-limit:
    enabled: ${ROUTESHARE_RATE_LIMIT_ENABLED:true}
    otp-request-per-hour: ${ROUTESHARE_RATE_LIMIT_OTP_REQUEST_PER_HOUR:5}
    otp-verify-per-hour: ${ROUTESHARE_RATE_LIMIT_OTP_VERIFY_PER_HOUR:10}
    payment-intent-per-minute: ${ROUTESHARE_RATE_LIMIT_PAYMENT_INTENT_PER_MIN:10}
    sos-per-minute: ${ROUTESHARE_RATE_LIMIT_SOS_PER_MIN:5}
    places-autocomplete-per-minute: ${ROUTESHARE_RATE_LIMIT_PLACES_AUTOCOMPLETE_PER_MIN:40}
    places-details-per-minute: ${ROUTESHARE_RATE_LIMIT_PLACES_DETAILS_PER_MIN:20}
    directions-per-minute: ${ROUTESHARE_RATE_LIMIT_DIRECTIONS_PER_MIN:20}
    ride-search-per-minute: ${ROUTESHARE_RATE_LIMIT_RIDE_SEARCH_PER_MIN:30}

  push:
    enabled: ${PUSH_NOTIFICATIONS_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

  object-storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:routeshare-documents}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    path-style: ${OBJECT_STORAGE_PATH_STYLE:true}
    presign-ttl-seconds: ${OBJECT_STORAGE_PRESIGN_TTL_SECONDS:900}

  chat:
    message-rate-limit-per-minute: ${ROUTESHARE_CHAT_MESSAGE_RATE_LIMIT_PER_MINUTE:20}

  support:
    attachment-max-bytes: ${ROUTESHARE_SUPPORT_ATTACHMENT_MAX_BYTES:10485760}
    attachment-allowed-types: ${ROUTESHARE_SUPPORT_ATTACHMENT_ALLOWED_TYPES:image/jpeg,image/png,application/pdf}

  rewards:
    referral-link-base-url: ${ROUTESHARE_REFERRAL_LINK_BASE_URL:https://comigo.lk/j/}

  events:
    # When false, domain events are still written to common.event_outbox but the relay
    # logs instead of publishing to Kafka. Enable once a broker is reachable.
    kafka-enabled: ${ROUTESHARE_EVENTS_KAFKA_ENABLED:false}
    topic-prefix: ${ROUTESHARE_EVENTS_TOPIC_PREFIX:routeshare.}
    relay-batch-size: ${ROUTESHARE_EVENTS_RELAY_BATCH_SIZE:100}
    relay-fixed-delay-ms: ${ROUTESHARE_EVENTS_RELAY_DELAY_MS:2000}

  keycloak-admin:
    enabled: ${ROUTESHARE_KEYCLOAK_USER_SYNC_ENABLED:true}
    server-url: ${ROUTESHARE_KEYCLOAK_SERVER_URL:http://localhost:8081}
    realm: ${ROUTESHARE_KEYCLOAK_REALM:routeshare}
    admin-realm: ${ROUTESHARE_KEYCLOAK_ADMIN_REALM:master}
    client-id: ${ROUTESHARE_KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${ROUTESHARE_KEYCLOAK_ADMIN_USERNAME:${KEYCLOAK_ADMIN:admin}}
    password: ${ROUTESHARE_KEYCLOAK_ADMIN_PASSWORD:${KEYCLOAK_ADMIN_PASSWORD:admin}}
    passenger-role: ${ROUTESHARE_KEYCLOAK_PASSENGER_ROLE:PASSENGER}
