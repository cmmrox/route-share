server:
  port: 8080
spring:
  application:
    name: routeshare-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ROUTESHARE_JDBC_URL:jdbc:postgresql://localhost:5432/routeshare}
    username: ${ROUTESHARE_DB_USER:routeshare}
    password: ${ROUTESHARE_DB_PASSWORD:routeshare_dev_password}
    hikari:
      maximum-pool-size: ${ROUTESHARE_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${ROUTESHARE_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${ROUTESHARE_DB_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${ROUTESHARE_REDIS_HOST:localhost}
      port: ${ROUTESHARE_REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ROUTESHARE_KEYCLOAK_ISSUER:http://localhost:8081/realms/routeshare}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.routeshare: INFO


routeshare:
  notify-lk:
    enabled: ${NOTIFY_LK_ENABLED:false}
    api-base-url: ${NOTIFY_LK_API_BASE_URL:https://app.notify.lk/api/v1}
    user-id: ${NOTIFY_LK_API_USER_ID:}
    api-key: ${NOTIFY_LK_API_KEY:}
    sender-id: ${NOTIFY_LK_SENDER_ID:}
    allow-demo-sender-for-otp: ${NOTIFY_LK_ALLOW_DEMO_SENDER_FOR_OTP:false}
    otp-message-template: ${NOTIFY_LK_OTP_MESSAGE_TEMPLATE:Your RouteShare verification code is %s. It expires in %d minutes.}

  keycloak-admin:
    enabled: ${ROUTESHARE_KEYCLOAK_USER_SYNC_ENABLED:true}
    server-url: ${ROUTESHARE_KEYCLOAK_SERVER_URL:http://localhost:8081}
    realm: ${ROUTESHARE_KEYCLOAK_REALM:routeshare}
    admin-realm: ${ROUTESHARE_KEYCLOAK_ADMIN_REALM:master}
    client-id: ${ROUTESHARE_KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${ROUTESHARE_KEYCLOAK_ADMIN_USERNAME:${KEYCLOAK_ADMIN:admin}}
    password: ${ROUTESHARE_KEYCLOAK_ADMIN_PASSWORD:${KEYCLOAK_ADMIN_PASSWORD:admin}}
    passenger-role: ${ROUTESHARE_KEYCLOAK_PASSENGER_ROLE:PASSENGER}
