<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RouteShare · Passenger App · Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f0eee9;
    font-family: "Plus Jakarta Sans", system-ui;
    color: #1b1410;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @keyframes blink { 50% { opacity: 0 } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.5); opacity: .5 } }

  /* ====== PRINT LAYOUT (replaces design canvas) ====== */
  .print-doc { max-width: 1100px; margin: 0 auto; padding: 32px 40px 60px; }

  .cover {
    min-height: 900px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 48px;
    background: #1b1410;
    color: #faf7f2;
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    break-after: page;
  }
  .cover::after {
    content: "";
    position: absolute; right: -120px; top: -120px;
    width: 480px; height: 480px; border-radius: 50%;
    background: #d66a3b; opacity: .85;
  }
  .cover-meta { position: relative; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; opacity: .65; font-weight: 700; }
  .cover-title { position: relative; font-family: "Fraunces", serif; font-size: 88px; line-height: .95; letter-spacing: -0.03em; font-weight: 500; margin-top: 24px; }
  .cover-sub { position: relative; font-size: 18px; line-height: 1.4; max-width: 540px; margin-top: 20px; opacity: .82; }
  .cover-foot { position: relative; display: flex; justify-content: space-between; align-items: flex-end; }
  .cover-stats { display: flex; gap: 40px; }
  .cover-stats > div .n { font-family: "Fraunces", serif; font-size: 44px; font-weight: 500; line-height: 1; }
  .cover-stats > div .l { font-size: 11px; opacity: .7; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; margin-top: 6px; }

  .section { break-before: page; padding-top: 32px; }
  .section:first-of-type { break-before: auto; }
  .sec-label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #d66a3b; font-weight: 800; }
  .sec-title { font-family: "Fraunces", serif; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 500; margin: 6px 0 6px; }
  .sec-sub { font-size: 14px; color: #6b5f56; max-width: 720px; line-height: 1.5; }
  .sec-rule { height: 1px; background: #e3ddd2; margin: 24px 0 28px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 36px 28px;
    justify-items: center;
  }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

  .card { width: 100%; display: flex; flex-direction: column; align-items: center; break-inside: avoid; }
  .card-frame { width: 300px; height: 647px; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 28px rgba(27,20,16,.08), 0 2px 6px rgba(27,20,16,.04); border: 1px solid #e3ddd2; background: #fff; }
  .card-frame > * { transform: scale(0.789); transform-origin: top left; width: 380px !important; height: 820px !important; }
  .card-label { margin-top: 14px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: -0.005em; }
  .card-id { font-family: "JetBrains Mono", monospace; font-size: 10px; color: #9d8c7e; font-weight: 500; margin-top: 2px; letter-spacing: .04em; }

  .page-foot { margin-top: 40px; display: flex; justify-content: space-between; font-size: 10px; color: #9d8c7e; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; border-top: 1px solid #e3ddd2; padding-top: 12px; }

  /* turn off any interactive cursor/ hover inside the frames */
  button, a { pointer-events: none !important; cursor: default !important; }

  /* ====== @media print ====== */
  @page { size: A3 portrait; margin: 12mm; }
  @media print {
    html, body { background: #faf7f2; }
    .print-doc { padding: 0; }
    .cover { padding: 50px 40px; min-height: calc(100vh - 24mm); }
    .section { padding-top: 0; }
    .card-frame { box-shadow: 0 4px 12px rgba(27,20,16,.08) !important; }
    .grid { gap: 26px 18px; }
    .card-frame { width: 260px; height: 561px; }
    .card-frame > * { transform: scale(0.684); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="phone.jsx"></script>
<script type="text/babel" src="screens-auth.jsx"></script>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-ride.jsx"></script>
<script type="text/babel" src="screens-account.jsx"></script>
<script type="text/babel" src="screens-variants.jsx"></script>

<script type="text/babel">
function Screen({ id, label, children }) {
  return (
    <div className="card">
      <div className="card-frame">{children}</div>
      <div className="card-label">{label}</div>
      <div className="card-id">{id}</div>
    </div>
  );
}

function Section({ num, label, title, sub, cols, children }) {
  return (
    <section className="section">
      <div className="sec-label">{num} · {label}</div>
      <div className="sec-title">{title}</div>
      <div className="sec-sub">{sub}</div>
      <div className="sec-rule"/>
      <div className={`grid ${cols === 2 ? "cols-2" : cols === 4 ? "cols-4" : ""}`}>
        {children}
      </div>
      <div className="page-foot">
        <span>RouteShare Passenger App · Hi-fi mockups</span>
        <span>{title}</span>
      </div>
    </section>
  );
}

function Doc() {
  return (
    <div className="print-doc">
      <div className="cover">
        <div>
          <div className="cover-meta">Business Requirements · Concept Validation · Android</div>
          <div className="cover-title">RouteShare<br/>Passenger<br/>App.</div>
          <div className="cover-sub">A route-based ride sharing platform for Colombo — drivers publish planned routes, passengers book full or partial overlap. 22 hi-fi screens across 7 flows, plus two hero variations.</div>
        </div>
        <div className="cover-foot">
          <div className="cover-stats">
            <div><div className="n">25</div><div className="l">Screens</div></div>
            <div><div className="n">8</div><div className="l">Flows</div></div>
            <div><div className="n">2</div><div className="l">Hero variants</div></div>
          </div>
          <div style={{textAlign:"right", fontSize:11, opacity:.6, letterSpacing:".12em", fontWeight:700, textTransform:"uppercase"}}>April 2026<br/>v1.0</div>
        </div>
      </div>

      <Section num="01" label="Onboarding" title="Splash & intro" sub="First-run experience — brand moment plus three intro slides that establish the route-based model." cols={4}>
        <Screen id="01" label="Splash"><SplashScreen/></Screen>
        <Screen id="02a" label="Intro · 1 of 3"><OnboardingScreen step={0}/></Screen>
        <Screen id="02b" label="Intro · 2 of 3"><OnboardingScreen step={1}/></Screen>
        <Screen id="02c" label="Intro · 3 of 3"><OnboardingScreen step={2}/></Screen>
      </Section>

      <Section num="02" label="Sign up & profile" title="Account creation" sub="Phone + OTP is the primary path. Profile setup covers name, photo, and emergency contact.">
        <Screen id="03" label="Login"><LoginScreen/></Screen>
        <Screen id="04" label="OTP verification"><OtpScreen/></Screen>
        <Screen id="05" label="Profile setup"><ProfileSetupScreen/></Screen>
      </Section>

      <Section num="03" label="Discover · Variant A" title="Home & search — map-first" sub="Classic ride-hailing pattern: the map is the hero, the where-to panel anchored at the bottom.">
        <Screen id="06" label="Home · map"><HomeScreen/></Screen>
        <Screen id="07" label="Search places"><SearchScreen/></Screen>
        <Screen id="08" label="Results · list"><ResultsListScreen/></Screen>
        <Screen id="09" label="Results · map"><ResultsMapScreen/></Screen>
        <Screen id="10" label="Ride detail"><RideDetailScreen/></Screen>
      </Section>

      <Section num="04" label="Discover · Variant B" title="Home & search — commuter dashboard" sub="Content-first alternative. Home surfaces the user's usual commute; results grouped by overlap tier; ride detail in editorial style.">
        <Screen id="06b" label="Home · dashboard"><HomeScreenB/></Screen>
        <Screen id="08b" label="Results · grouped"><ResultsListScreenB/></Screen>
        <Screen id="10b" label="Ride detail · editorial"><RideDetailScreenB/></Screen>
      </Section>

      <Section num="05" label="Book & pay" title="Booking flow" sub="Seat selection, payment method, and booked-waiting state after confirmation.">
        <Screen id="11" label="Seat selection"><SeatSelectScreen seatCount={1}/></Screen>
        <Screen id="12" label="Payment method"><PaymentScreen/></Screen>
        <Screen id="13" label="Booked · waiting"><BookedScreen/></Screen>
      </Section>

      <Section num="06" label="Trip" title="During the trip" sub="Live tracking, early-exit flow, trip completion receipt and driver rating." cols={4}>
        <Screen id="14" label="In trip · live"><InTripScreen/></Screen>
        <Screen id="15" label="Get off early"><ExitEarlyScreen/></Screen>
        <Screen id="16" label="Receipt"><ReceiptScreen/></Screen>
        <Screen id="17" label="Rate driver"><RateDriverScreen/></Screen>
      </Section>

      <Section num="07" label="Account" title="Account & history" sub="Profile, trip history, saved places, and notifications." cols={4}>
        <Screen id="18" label="Trip history"><TripHistoryScreen/></Screen>
        <Screen id="19" label="Saved places"><SavedPlacesScreen/></Screen>
        <Screen id="20" label="Account"><AccountScreen/></Screen>
        <Screen id="23" label="Notifications"><NotificationsScreen/></Screen>
      </Section>

      <Section num="08" label="Safety & support" title="Safety and help" sub="SOS with emergency contacts, share-trip for friends/family, and the help center.">
        <Screen id="21" label="SOS · emergency"><SosScreen/></Screen>
        <Screen id="22" label="Share trip"><ShareTripScreen/></Screen>
        <Screen id="24" label="Help center"><SupportScreen/></Screen>
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Doc/>);

// Auto-print once fonts + JSX + a grace delay have resolved
(async () => {
  try { await document.fonts.ready; } catch(e) {}
  await new Promise(r => setTimeout(r, 1200));
  window.print();
})();
</script>
</body>
</html>
